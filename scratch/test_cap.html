<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #FDE8EF; display: flex; gap: 40px; padding: 50px; font-family: sans-serif; }
.card {
  position: relative;
  width: 500px;
  padding: 40px;
  background: #FFFDFC;
  border: 1.5px solid #F8D3E2;
  border-radius: 12px;
  box-shadow: 0 30px 60px -36px rgba(120, 20, 60, .2);
}
.l-place { text-align: right; font-style: italic; color: #855870; margin-bottom: 20px; font-size: 16px; }
.l-greet { font-weight: 600; color: #E8275E; margin-bottom: 15px; font-size: 18px; }
.l-p { color: #A22758; line-height: 1.7; font-size: 16px; }

.paper-cap {
  position: absolute;
  top: -26px;
  right: 16px;
  width: 90px;
  height: 90px;
  pointer-events: none;
  z-index: 5;
  filter: drop-shadow(0 8px 18px rgba(162, 39, 88, 0.22)) drop-shadow(0 2px 4px rgba(45, 10, 30, 0.15));
  transform: rotate(10deg);
  transition: transform 0.4s cubic-bezier(.2, .75, .15, 1);
}
.card:hover .paper-cap {
  transform: rotate(14deg) scale(1.05);
}
</style>
</head>
<body>

<div class="card">
  <div class="paper-cap">
    <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Velvet Berry Cap Gradients -->
        <linearGradient id="capTop" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#7B1A46"/>
          <stop offset="45%" stop-color="#541230"/>
          <stop offset="100%" stop-color="#2D0819"/>
        </linearGradient>
        <linearGradient id="capEdge" x1="0%" y1="0%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#3D0B22"/>
          <stop offset="50%" stop-color="#240514"/>
          <stop offset="100%" stop-color="#18030D"/>
        </linearGradient>
        <linearGradient id="capBase" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38091F"/>
          <stop offset="100%" stop-color="#1F0411"/>
        </linearGradient>
        
        <!-- Metallic Gold Gradients -->
        <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF5D6"/>
          <stop offset="35%" stop-color="#ECC870"/>
          <stop offset="70%" stop-color="#D4AF37"/>
          <stop offset="100%" stop-color="#9E7318"/>
        </linearGradient>
        <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#FFF2D0"/>
          <stop offset="30%" stop-color="#ECC870"/>
          <stop offset="75%" stop-color="#D49B45"/>
          <stop offset="100%" stop-color="#B36F1E"/>
        </linearGradient>
        <linearGradient id="ribbonPink" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFA8C5"/>
          <stop offset="100%" stop-color="#E8275E"/>
        </linearGradient>
      </defs>

      <!-- Skull cap / Underneath base -->
      <path d="M38 52 C38 66 82 66 82 52 Z" fill="url(#capBase)"/>
      <path d="M38 52 C44 68 76 68 82 52" fill="none" stroke="url(#goldShine)" stroke-width="1.2" opacity="0.6"/>

      <!-- Cap Rim / Lower Edge for 3D thickness -->
      <polygon points="12,38 60,62 108,38 108,43 60,67 12,43" fill="url(#capEdge)"/>

      <!-- Mortarboard Top diamond -->
      <polygon points="60,14 108,38 60,62 12,38" fill="url(#capTop)" stroke="rgba(255, 205, 225, 0.4)" stroke-width="1"/>
      <!-- Soft inner satin sheen line -->
      <path d="M58 18 L104 38 L60 60" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Little chic golden sparkle at the peak -->
      <path d="M26 18 Q26 23 21 23 Q26 23 26 28 Q26 23 31 23 Q26 23 26 18 Z" fill="url(#goldShine)"/>
      <circle cx="26" cy="23" r="1" fill="#FFFFFF"/>

      <!-- Center Button with metallic rim -->
      <ellipse cx="60" cy="38" rx="5" ry="4" fill="url(#goldShine)"/>
      <circle cx="60" cy="37.5" r="2.2" fill="#FFF9E6"/>

      <!-- Flowing Tassel Cord (curving smoothly over the right corner) -->
      <path d="M60 38 Q78 35 94 36 Q108 38 104 52 Q98 62 100 75" 
            fill="none" stroke="url(#tasselGrad)" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M60 38 Q78 35 94 36 Q108 38 104 52 Q98 62 100 75" 
            fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" stroke-linecap="round"/>

      <!-- Tassel Ring / Band -->
      <ellipse cx="100" cy="76" rx="4.2" ry="2.2" fill="url(#goldShine)"/>
      
      <!-- Tiny decorative ribbon / bow tie on tassel for 'điệu' touch -->
      <path d="M96 74 C91 70 91 78 96 75 Z" fill="url(#ribbonPink)"/>
      <path d="M104 74 C109 70 109 78 104 75 Z" fill="url(#ribbonPink)"/>
      <circle cx="100" cy="74.5" r="1.5" fill="url(#goldShine)"/>

      <!-- Silky Tassel Fringe / Skirt -->
      <path d="M96 77 C94 86 91 97 93 104 C97 106 103 106 107 104 C109 97 106 86 104 77 Z" fill="url(#tasselGrad)"/>
      <!-- Tassel texture threads -->
      <path d="M95 80 L94 103 M97 78 L97 104 M100 78 L100 105 M103 78 L103 104 M105 80 L106 103" 
            stroke="#7A4B10" stroke-width="0.75" opacity="0.5"/>
      <path d="M98 79 L98 104 M101 79 L101 104" 
            stroke="#FFF5D6" stroke-width="0.6" opacity="0.7"/>
    </svg>
  </div>

  <p class="l-place">TP. Hồ Chí Minh, ngày 28 tháng 11 năm 2026</p>
  <p class="l-greet">Thân gửi những người thương,</p>
  <p class="l-p">Vậy là hành trình bốn năm đại học cũng đã đi đến một cột mốc đáng nhớ. Nhìn lại quãng thời gian đã qua, Ngọc Tú cảm thấy thật may mắn khi trên hành trình ấy luôn có sự quan tâm, giúp đỡ và đồng hành của mọi người.</p>
</div>

</body>
</html>
