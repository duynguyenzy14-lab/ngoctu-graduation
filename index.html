<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ngọc Tú – Graduation 2026</title>
  
  <!-- Font chữ tạp chí (Playfair Display) và font viết tay tiếng Việt chuẩn (Dancing Script) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  
  <!-- File CSS giao diện Scrapbook x Editorial -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- SECTION 01: THE COVER (SCRAPBOOK × EDITORIAL) -->
  <section class="sec-cover" id="cover">
    <div class="cover-wrapper">
      <!-- Tiêu đề phong cách Editorial -->
      <header class="editorial-header">
        <p class="sub-headline">The Graduation Day of</p>
        <h1 class="main-title">Ngọc Tú</h1>
        <p class="tagline">Class of 2022 – 2026 · Quản lý công</p>
      </header>

      <!-- TẤM POLAROID LỚN (LVHQ0663) -->
      <div class="polaroid-main">
        <!-- Băng dính washi dán góc trên trái -->
        <div class="washi-tape"></div>

        <!-- Sticker OU Graduation đính chéo góc trên cùng bên phải -->
        <span class="sticker-ou-tag">OU Graduation</span>

        <div class="polaroid-inner">
          <img src="./graduation_files/lvhq0663-portrait.jpg" alt="Nguyễn Ngọc Tú - Graduation 2026" class="polaroid-photo">
          <div class="polaroid-caption">
            <p class="polaroid-text">Một ngày thật đẹp để khởi đầu chương mới</p>
          </div>
        </div>
      </div>

      <!-- Lời mời cuộn xuống -->
      <div class="cover-cta">
        <a href="#section-2" class="btn-scroll-down">
          <span>Khám phá thiệp mời</span>
          <span class="arrow">↓</span>
        </a>
      </div>
    </div>
  </section>

</body>
</html>
