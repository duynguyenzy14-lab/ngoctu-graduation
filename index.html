<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ngọc Tú – Graduation 2026</title>
  
  <!-- Font chữ tạp chí (Playfair Display) và font viết tay (Caveat / Dancing Script) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- File CSS giao diện Scrapbook x Editorial -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- SECTION 01: THE COVER (SCRAPBOOK × EDITORIAL) -->
  <section class="sec-cover" id="cover">
    <!-- Sticker trang trí scrapbook -->
    <div class="scrapbook-decor" aria-hidden="true">
      <span class="sticker tag-date">Nov 28, 2026</span>
      <span class="sticker tag-edu">OU Graduation 🎓</span>
    </div>

    <div class="cover-wrapper">
      <!-- Tiêu đề phong cách Editorial -->
      <header class="editorial-header">
        <p class="sub-headline">The Graduation Day of</p>
        <h1 class="main-title">Ngọc Tú</h1>
        <p class="tagline">Class of 2022 – 2026 · Quản lý công</p>
      </header>

      <!-- TẤM POLAROID LỚN (LVHQ0663) -->
      <div class="polaroid-main">
        <div class="washi-tape"></div>
        <div class="polaroid-inner">
          <img src="./graduation_files/lvhq0663-800.jpg" alt="Nguyễn Ngọc Tú - Graduation 2026" class="polaroid-photo">
          <div class="polaroid-caption">
            <p class="handwriting">Một ngày thật đẹp để khép lại thanh xuân ✨</p>
            <span class="polaroid-date">28.11.2026</span>
          </div>
        </div>
      </div>

      <!-- Lời mời cuộn xuống -->
      <div class="cover-cta">
        <a href="#section-2" class="btn-scroll-down">
          <span>Khám phá thiệp mời</span>
          <span class="arrow">↓</span>
        </a>
      </div>
    </div>
  </section>

</body>
</html>
